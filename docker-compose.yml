# Sobe o sistema completo: banco, API, front-end e agente de impressão.
# Funciona sem configuração, mas antes de usar em produção copie .env.example para .env
# e troque as senhas e o segredo. O agente de impressão deve rodar na rede da fábrica
# (junto do servidor local ou em um computador da rede, quando a aplicação estiver na nuvem).
name: apontamento

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-apontamento}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apontamento}
      POSTGRES_DB: ${POSTGRES_DB:-apontamento}
      TZ: UTC
    volumes:
      - dados-banco:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-apontamento}:${POSTGRES_PASSWORD:-apontamento}@db:5432/${POSTGRES_DB:-apontamento}
      JWT_SEGREDO: ${JWT_SEGREDO:-troque-este-segredo-no-arquivo-env}
      JWT_ACESSO_MINUTOS: ${JWT_ACESSO_MINUTOS:-15}
      RENOVACAO_DIAS: ${RENOVACAO_DIAS:-30}
      CARREGAR_DADOS_EXEMPLO: ${CARREGAR_DADOS_EXEMPLO:-true}
      TZ: UTC

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${PORTA_WEB:-8080}:80'

  agente-impressao:
    build:
      context: .
      dockerfile: apps/print-agent/Dockerfile
    restart: unless-stopped
    environment:
      AGENTE_TOKEN: ${AGENTE_TOKEN:-troque-este-token}
      AGENTE_PORTAS: ${AGENTE_PORTAS:-9100}
      AGENTE_ORIGENS: ${AGENTE_ORIGENS:-*}
      # Deixe vazio para imprimir de verdade; com um diretório, grava o ZPL em arquivos (simulação).
      AGENTE_SIMULAR_DIR: ${AGENTE_SIMULAR_DIR:-}
    ports:
      - '${PORTA_AGENTE:-9180}:9180'

volumes:
  dados-banco:
